<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3A2A"/>
      <stop offset="50%" stop-color="#2D5A3D"/>
      <stop offset="100%" stop-color="#3D6B4A"/>
    </linearGradient>
    <linearGradient id="paw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8F5E9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Lens circle -->
  <circle cx="210" cy="210" r="90" fill="none" stroke="url(#paw)" stroke-width="12"/>
  <circle cx="210" cy="210" r="50" fill="none" stroke="url(#paw)" stroke-width="8"/>
  <circle cx="210" cy="210" r="14" fill="url(#paw)"/>
  <!-- Paw print -->
  <g transform="translate(310, 310) scale(0.9)" fill="url(#paw)">
    <ellipse cx="0" cy="-30" rx="22" ry="28" transform="rotate(-15)"/>
    <ellipse cx="-28" cy="-12" rx="18" ry="24" transform="rotate(-40)"/>
    <ellipse cx="-36" cy="18" rx="18" ry="24" transform="rotate(-70)"/>
    <ellipse cx="28" cy="-12" rx="18" ry="24" transform="rotate(15)"/>
    <ellipse cx="36" cy="18" rx="18" ry="24" transform="rotate(40)"/>
    <ellipse cx="0" cy="20" rx="34" ry="30"/>
  </g>
  <!-- Sparkle -->
  <circle cx="380" cy="140" r="6" fill="#F5A623"/>
  <line x1="380" y1="110" x2="380" y2="130" stroke="#F5A623" stroke-width="4" stroke-linecap="round"/>
  <line x1="380" y1="150" x2="380" y2="170" stroke="#F5A623" stroke-width="4" stroke-linecap="round"/>
  <line x1="350" y1="140" x2="370" y2="140" stroke="#F5A623" stroke-width="4" stroke-linecap="round"/>
  <line x1="390" y1="140" x2="410" y2="140" stroke="#F5A623" stroke-width="4" stroke-linecap="round"/>
</svg>
