<!DOCTYPE html><html class="h-full" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Login - seemorcam</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

                        "surface": "#fff8f5",

                        "primary": "#98461e",
                        "primary-fixed": "#ffdbcd",
                        "error-container": "#ffdad6",
                        "surface-variant": "#eae1dc",
                        "tertiary": "#5f5e5b",
                        "on-tertiary-fixed": "#1c1c1a",
                        "on-primary": "#ffffff",
                        "on-primary-fixed-variant": "#7a3008",
                        "on-surface-variant": "#55433b",
                        "background": "#fff8f5",
                        "secondary-container": "#a3f0f0",
                        "surface-bright": "#fff8f5",

                        "surface-container-highest": "#eae1dc",

                        "tertiary-fixed-dim": "#c8c6c2",
                        "surface-container": "#f5ece8",
                        "secondary": "#0c696a",

                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#98461e",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-page": "20px",
                        "gutter-card": "16px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "stack-lg": "32px"
                    },
                    "fontFamily": {
                        "label-sm": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-xl": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],

<style>
        .input-filled:focus-within label,
        .input-filled input:not(:placeholder-shown) ~ label {
            transform: scale(0.75) translateY(-1rem) translateX(-0.1rem);
            color: theme('colors.primary');
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-background text-on-background h-full flex flex-col font-body-md text-body-md antialiased overflow-hidden">
<!-- Suppressed Nav Shells due to Linear/Transactional Intent (Login) -->
<main class="flex-1 flex flex-col justify-center px-margin-page relative w-full max-w-md mx-auto h-full">
<!-- Ambient Decorative Background Element -->
<div class="absolute top-[-10%] right-[-20%] w-[120%] h-[120%] bg-surface-container-high rounded-full blur-[100px] opacity-40 -z-10 pointer-events-none"></div>
<div class="w-full space-y-stack-lg relative z-10 glass-panel p-6 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)]">
<!-- Header Section -->
<div class="text-center space-y-stack-sm flex flex-col items-center">
<div class="w-16 h-16 bg-primary/10 rounded-full flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">pets</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-primary">seemorcam</h1>
<p class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mt-2">Welcome Back</p>
<p class="text-on-surface-variant font-body-md text-body-md opacity-80">Log in to check on your furry friends.</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-stack-md w-full" method="POST">
<!-- Email Input -->
<div class="relative input-filled">
<input class="block w-full px-4 pt-6 pb-2 text-on-surface bg-surface-container-lowest border-0 rounded-lg appearance-none focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all peer" id="email" name="email" placeholder=" " required="" type="email">
<label class="absolute text-on-surface-variant font-body-md text-body-md duration-300 transform -translate-y-3 scale-75 top-4 z-10 origin-[0] left-4 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-3" for="email">Email Address</label>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="relative input-filled">
<input class="block w-full px-4 pt-6 pb-2 text-on-surface bg-surface-container-lowest border-0 rounded-lg appearance-none focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all peer" id="password" name="password" placeholder=" " required="" type="password">
<label class="absolute text-on-surface-variant font-body-md text-body-md duration-300 transform -translate-y-3 scale-75 top-4 z-10 origin-[0] left-4 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-3" for="password">Password</label>
</div>
<div class="flex justify-end w-full">
<a class="font-label-sm text-label-sm text-primary hover:text-on-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary font-headline-lg-mobile text-headline-lg-mobile py-4 rounded-xl shadow-lg hover:bg-on-primary-container hover:shadow-xl transition-all duration-200 active:scale-[0.98] mt-4 flex items-center justify-center gap-2" type="button">
                    Log In
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Sign Up Link -->
<div class="text-center pt-stack-md border-t border-outline-variant/30">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-headline-lg-mobile text-headline-lg-mobile text-primary hover:text-on-primary-container transition-colors ml-1" href="#">Sign Up</a>
</p>
</div>
</div>
</main>
</body></html>
