<div class="w-2 h-2 rounded-full bg-secondary"></div>

<div class="text-center mb-stack-lg flex flex-col items-center gap-1">

<button class="w-full flex items-center justify-between p-gutter-card bg-surface-container-lowest rounded-2xl shadow-sm hover:shadow-md transition-shadow active:scale-[0.98] border border-outline-variant/10">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary-container/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1;">restaurant</span>
</div>
<span class="font-body-md text-body-md font-semibold text-on-surface">Manual Feeding</span>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
<!-- Scheduled Feeding -->
<button class="w-full flex items-center justify-between p-gutter-card bg-surface-container-lowest rounded-2xl shadow-sm hover:shadow-md transition-shadow active:scale-[0.98] border border-outline-variant/10">

</div>

</div>
