<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Ambient Background Effect */
        .ambient-bg {
            background: radial-gradient(circle at 50% -20%, var(--tw-colors-surface-container-high) 0%, var(--tw-colors-background) 70%);
        }

        /* Input Autofill override */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px var(--tw-colors-background) inset !important;
            -webkit-text-fill-color: var(--tw-colors-on-surface) !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md ambient-bg relative overflow-x-hidden">
<!-- Top Navigation (Suppressed - Transactional Page) -->
<!-- However, we need a brand header for a sign up page -->
<header class="w-full flex justify-center items-center py-stack-lg mt-stack-md z-10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">pets</span>
<h1 class="font-headline-xl text-headline-xl text-primary font-bold tracking-tight">seemorcam</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-page pb-stack-lg w-full max-w-md mx-auto z-10 relative">
<!-- Welcome Text -->
<div class="text-center w-full mb-stack-lg">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-sm">Create Account</h2>
<p class="font-body-md text-body-md text-on-surface-variant opacity-80">Join us to stay close to your furry friends.</p>
</div>
<!-- Sign Up Form Card -->
<div class="w-full bg-surface-container-lowest rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-stack-md sm:p-stack-lg border border-outline-variant/30">
<form action="#" class="flex flex-col gap-stack-md w-full" method="POST">
<!-- Username -->

<!-- Email -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline-variant pointer-events-none">mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-background border-none rounded-lg text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary focus:outline-none transition-all placeholder:text-outline-variant/70" id="email" name="email" placeholder="hello@example.com" required="" type="email">
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase" for="password">Password</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-4 text-outline-variant pointer-events-none">lock</span>
<input class="w-full pl-12 pr-12 py-4 bg-background border-none rounded-lg text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary focus:outline-none transition-all placeholder:text-outline-variant/70" id="password" name="password" placeholder="Create a strong password" required="" type="password">
<button class="absolute right-4 text-outline-variant hover:text-primary transition-colors focus:outline-none" onclick="togglePassword('password', this)" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password -->

<!-- Terms Checkbox -->

<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-headline-lg-mobile text-headline-lg-mobile py-4 rounded-full mt-stack-md hover:opacity-90 active:scale-[0.98] transition-all shadow-[0_4px_14px_rgba(152,70,30,0.25)] flex justify-center items-center gap-2 group" type="submit">
                    Sign Up
                    <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Login Link -->
<div class="mt-stack-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-semibold hover:underline decoration-2 underline-offset-4 ml-1" href="#">Log In</a>
</p>
</div>
</div>
</main>
<!-- Decorative background elements -->
<div class="fixed top-[-10%] right-[-10%] w-64 h-64 bg-primary-fixed/20 rounded-full blur-[80px] pointer-events-none z-0"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-80 h-80 bg-secondary-fixed/30 rounded-full blur-[100px] pointer-events-none z-0"></div>
<script>
        // Simple password toggle functionality
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector('span');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
                icon.classList.add('text-primary');
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
                icon.classList.remove('text-primary');
            }
        }
    </script>
</body></html>
