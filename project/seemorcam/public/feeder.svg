<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 300 340" fill="none">
  <!-- Feeder body -->
  <rect x="60" y="80" width="180" height="240" rx="24" fill="#fff8f5" stroke="#98461e" stroke-width="3"/>
  <!-- Top lid -->
  <rect x="70" y="60" width="160" height="30" rx="12" fill="#f5ece8" stroke="#98461e" stroke-width="2"/>
  <!-- Food window -->
  <rect x="90" y="120" width="120" height="80" rx="12" fill="#eae1dc"/>
  <!-- Food kibble icons -->
  <circle cx="130" cy="145" r="8" fill="#98461e" opacity="0.6"/>
  <circle cx="160" cy="150" r="7" fill="#98461e" opacity="0.5"/>
  <circle cx="145" cy="170" r="9" fill="#98461e" opacity="0.4"/>
  <circle cx="170" cy="140" r="6" fill="#98461e" opacity="0.5"/>
  <circle cx="120" cy="165" r="7" fill="#98461e" opacity="0.45"/>
  <circle cx="155" cy="135" r="6" fill="#98461e" opacity="0.55"/>
  <!-- Bowl area -->
  <ellipse cx="150" cy="300" rx="70" ry="30" fill="#f5ece8" stroke="#98461e" stroke-width="2"/>
  <ellipse cx="150" cy="295" rx="55" ry="22" fill="#eae1dc"/>
  <!-- Bowl rim highlight -->
  <ellipse cx="150" cy="285" rx="60" ry="12" fill="none" stroke="#0c696a" stroke-width="1.5" opacity="0.4"/>
  <!-- Status LED -->
  <circle cx="150" cy="340" r="5" fill="#0c696a"/>
  <!-- Brand label -->
  <rect x="100" y="355" width="100" height="24" rx="6" fill="#f28c5e" opacity="0.3"/>
  <text x="150" y="372" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#98461e" font-weight="600">SMART FEEDER</text>
</svg>
