<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Oksee · 首页</title>
<style>
:root{
  --teal:#135A4E;
  --teal-mid:#2F7E6E;
  --teal-light:#E7F1EF;
  --ink:#1E2A28;
  --ink-2:#596462;
  --bg:#F7F8F9;
  --line:#E9EDEC;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  display:flex;align-items:center;justify-content:center;
  background:#DFE3E4;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color:var(--ink);overflow:hidden;
}
.phone{
  position:relative;width:375px;height:812px;border-radius:40px;overflow:hidden;
  background:var(--bg);box-shadow:0 24px 60px rgba(0,0,0,.2);
  display:flex;flex-direction:column;
}
@media (max-width:480px){
  body{background:var(--bg);overflow:auto;}
  .phone{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none;}
}

/* ---------- 状态栏 ---------- */
.statusbar{
  height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px 0 22px;font-size:14px;font-weight:600;color:#111;
}
.sb-right{display:flex;align-items:center;gap:6px;}
.speed{display:flex;flex-direction:column;align-items:flex-end;line-height:10px;}
.speed b{font-size:10px;font-weight:600;}
.speed span{font-size:9px;color:#8A8F92;letter-spacing:.2px;}

/* ---------- 顶栏 ---------- */
.header{
  height:60px;flex:none;display:flex;align-items:center;
  padding:0 16px;gap:12px;
}
.brand-icon{
  width:42px;height:42px;border-radius:12px;flex:none;
  background:linear-gradient(145deg,#3F8F7E 0%,#135A4E 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 10px rgba(19,90,78,.28);
}
.brand-name{font-size:22px;font-weight:500;letter-spacing:.3px;}
.add-btn{
  margin-left:auto;width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;
  background:var(--teal-light);color:var(--teal);
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s ease,background .18s ease;
}
.add-btn:active{transform:scale(.94);background:#DCEAE7;}

/* ---------- 内容 ---------- */
.main{
  flex:1;display:flex;flex-direction:column;align-items:center;
  padding:8px 24px 0;overflow-y:auto;
}
.illustration{margin-top:10px;}
.illustration svg{display:block;}

.empty-title{
  margin-top:26px;font-size:17px;color:#3B4543;letter-spacing:.2px;
}
.cta{
  margin-top:22px;height:48px;padding:0 30px;border:0;border-radius:24px;cursor:pointer;
  background:var(--teal);color:#fff;font-size:17px;letter-spacing:.5px;
  display:inline-flex;align-items:center;gap:8px;
  box-shadow:0 8px 18px rgba(19,90,78,.22);
  transition:transform .12s ease,opacity .15s ease;
}
.cta:active{transform:scale(.97);opacity:.92;}

/* ---------- 底部 Tab ---------- */
.tabbar{
  flex:none;height:76px;display:flex;align-items:center;justify-content:space-around;
  padding:0 12px 6px;
}
.tab{
  border:0;background:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 18px;border-radius:26px;color:#5C6664;
  transition:background .18s ease,color .18s ease;
}
.tab svg{display:block;transition:color .18s ease;}
.tab.active{background:var(--teal-light);color:var(--teal);}
.tab-label{font-size:13px;letter-spacing:.3px;}

/* 轻提示 */
.toast{
  position:absolute;left:50%;bottom:120px;transform:translateX(-50%) translateY(6px);
  padding:9px 16px;border-radius:20px;background:rgba(30,42,40,.88);color:#fff;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:20;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.home-bar{
  position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  width:134px;height:5px;border-radius:3px;background:#1B1B1B;
}
</style>
</head>
<body>

<div class="phone">

  <!-- 状态栏 -->
  <div class="statusbar">
    <span>15:11</span>
    <div class="sb-right">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="7.4"/><path d="M12 9.4 v3.6 l2.4 1.6"/><path d="M5.2 4.4 3.6 6"/><path d="M18.8 4.4 20.4 6"/></svg>
      <div class="speed"><b>7.10</b><span>KB/s</span></div>
      <span style="font-size:10px;font-weight:600;color:#6E7376;margin-left:-2px;">5G</span>
      <svg width="15" height="12" viewBox="0 0 18 12" fill="#111"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="15" height="12" viewBox="0 0 17 12" fill="#111"><path d="M8.5 10.6 6 8.1a3.6 3.6 0 0 1 5 0zM8.5 3.6c-2.2 0-4.2.9-5.7 2.3L1.4 4.5A11.2 11.2 0 0 1 8.5 1.5c2.7 0 5.3 1.1 7.1 3l-1.4 1.4a8.4 8.4 0 0 0-5.7-2.3z"/></svg>
      <svg width="24" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.2" fill="#111"/><rect x="2.4" y="2.2" width="13" height="7.6" rx="1.8" fill="#fff" opacity=".9"/><path d="M23.2 4.2c1 .4 1 3.2 0 3.6V4.2z" fill="#111" fill-opacity=".45"/></svg>
      <span style="font-size:11px;font-weight:600;color:#111;margin-left:-3px;">85</span>
    </div>
  </div>

  <!-- 顶栏 -->
  <div class="header">
    <div class="brand-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <ellipse cx="12" cy="12" rx="8.4" ry="6" stroke="#fff" stroke-width="1.5" opacity=".95"/>
        <circle cx="12" cy="12" r="4" fill="#fff"/>
        <circle cx="12" cy="12" r="2.2" fill="#0F4A40"/>
        <circle cx="10.9" cy="10.9" r=".85" fill="#fff"/>
      </svg>
    </div>
    <span class="brand-name">Oksee</span>
    <button class="add-btn" id="addBtn" aria-label="添加">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 5.4 v13.2"/><path d="M5.4 12 h13.2"/></svg>
    </button>
  </div>

  <!-- 主体 -->
  <div class="main">
    <div class="illustration">
      <svg width="300" height="250" viewBox="0 0 300 250" fill="none">
        <defs>
          <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#E9F3F1" stop-opacity=".95"/>
            <stop offset="1" stop-color="#F7F8F9" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="phoneBody" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#F2F6F5"/>
          </linearGradient>
          <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1B4A43"/>
            <stop offset="1" stop-color="#0C2C27"/>
          </linearGradient>
          <radialGradient id="glowCircle" cx=".5" cy=".42" r=".6">
            <stop offset="0" stop-color="#DFEDEA"/>
            <stop offset="1" stop-color="#F3F8F7" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- 背景光 -->
        <circle cx="150" cy="108" r="96" fill="url(#glowCircle)"/>

        <!-- 地面阴影 -->
        <ellipse cx="152" cy="204" rx="88" ry="9" fill="#DFE6E5" opacity=".6"/>

        <!-- 手机 -->
        <g>
          <rect x="62" y="52" width="82" height="140" rx="16" fill="url(#phoneBody)" stroke="#DCE6E4" stroke-width="1.5"/>
          <rect x="94" y="62" width="18" height="3.6" rx="1.8" fill="#DCE6E4"/>
          <!-- 圆形相机区 -->
          <circle cx="103" cy="112" r="26" fill="#F1F6F5" stroke="#DCE6E4" stroke-width="1.2"/>
          <circle cx="103" cy="112" r="18.5" fill="none" stroke="#B9D2CC" stroke-width="1.4" stroke-dasharray="3.4 3.4"/>
          <circle cx="103" cy="112" r="4.6" fill="#2F7E6E"/>
          <!-- 底部按钮条 -->
          <rect x="76" y="160" width="54" height="12" rx="6" fill="#135A4E"/>
        </g>

        <!-- 摄像机 -->
        <g>
          <!-- 支架 -->
          <rect x="206" y="170" width="6" height="26" rx="3" fill="#D9E4E2"/>
          <ellipse cx="209" cy="198" rx="26" ry="7" fill="#E7EEED"/>
          <!-- 球体 -->
          <circle cx="209" cy="132" r="46" fill="#FFFFFF" stroke="#E2EAE8" stroke-width="1.5"/>
          <circle cx="209" cy="132" r="29" fill="url(#lens)"/>
          <circle cx="209" cy="132" r="19" fill="#0A2622"/>
          <circle cx="209" cy="132" r="9.5" fill="#123B34"/>
          <circle cx="201" cy="124" r="4.6" fill="#2F7E6E" opacity=".5"/>
          <circle cx="203" cy="126" r="1.9" fill="#CFE6E1" opacity=".75"/>
          <circle cx="209" cy="93" r="4.2" fill="#2F7E6E"/>
          <circle cx="209" cy="93" r="1.7" fill="#EAF3F1"/>
        </g>

        <!-- 连接弧线 -->
        <g stroke="#9AC8BE" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="0.5 7" opacity=".9">
          <path d="M146 120 q 24 -24 44 -20"/>
          <path d="M150 138 q 22 6 34 -12"/>
        </g>

        <!-- 星点 -->
        <path d="M126 58 l1.6 4.4 4.4 1.6 -4.4 1.6 -1.6 4.4 -1.6-4.4 -4.4-1.6 4.4-1.6z" fill="#9FD0C6"/>
        <path d="M244 62 l1.2 3.4 3.4 1.2 -3.4 1.2 -1.2 3.4 -1.2-3.4 -3.4-1.2 3.4-1.2z" fill="#9FD0C6"/>
        <circle cx="176" cy="66" r="2.4" fill="#BCE0D8"/>
        <circle cx="236" cy="86" r="2" fill="#BCE0D8"/>
      </svg>
    </div>

    <p class="empty-title">还没有设备，去添加一个吧</p>

    <button class="cta" id="ctaBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5.4 v13.2"/><path d="M5.4 12 h13.2"/></svg>
      添加设备
    </button>
  </div>

  <!-- 底部 Tab -->
  <div class="tabbar" id="tabbar">
    <button class="tab active" data-tab="home">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round">
        <path d="M4 11.2 L12 4.4 L20 11.2 V19 a1.2 1.2 0 0 1 -1.2 1.2 H5.2 A1.2 1.2 0 0 1 4 19 Z"/>
        <path d="M9.6 20.2 v-5.4 h4.8 v5.4"/>
      </svg>
      <span class="tab-label">首页</span>
    </button>
    <button class="tab" data-tab="msg">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round">
        <path d="M4 5.6 h16 v11 H9.6 L4.8 20.4 v-3.8 H4 Z"/>
      </svg>
      <span class="tab-label">消息</span>
    </button>
    <button class="tab" data-tab="me">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8.2" r="3.8"/>
        <path d="M4.8 20.2 c 0 -4 3.2 -6.2 7.2 -6.2 s 7.2 2.2 7.2 6.2"/>
      </svg>
      <span class="tab-label">账户</span>
    </button>
  </div>

  <div class="toast" id="toast"></div>
  <div class="home-bar"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));

let toastTimer = null;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1500);
}

$('#addBtn').addEventListener('click', () => toast('打开添加设备'));
$('#ctaBtn').addEventListener('click', () => toast('打开添加设备'));

$$('.tab').forEach((tab) => {
  tab.addEventListener('click', () => {
    $$('.tab').forEach((t) => t.classList.toggle('active', t === tab));
    const map = { home: '首页', msg: '消息', me: '账户' };
    toast('切换到' + map[tab.dataset.tab]);
  });
});
</script>
</body>
</html>
