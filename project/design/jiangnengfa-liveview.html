<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>江能发 · 实时预览</title>
<style>
:root {
  --bg-page: #F5F5F7;
  --bg-card: #FFFFFF;
  --bg-bar: #000000;
  --text-main: #1D1D1F;
  --text-sub: #8E8E93;
  --line: #EDEDF0;
  --icon: #111114;
  --orange: #FF8A1E;
  --blue: #1A73E8;
  --radius-card: 24px;
  --radius-btn: 12px;
  --shadow-float: 0 6px 24px rgba(0, 0, 0, 0.06);
  --header-h: 84px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }
body {
  display: flex; align-items: center; justify-content: center;
  background: #E9EAEE;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  color: var(--text-main);
  overflow: hidden;
}
.phone {
  position: relative; width: 375px; height: 812px;
  background: var(--bg-page); border-radius: 40px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.22); overflow: hidden;
}
@media (max-width: 480px) {
  body { background: var(--bg-page); overflow: auto; }
  .phone { width: 100%; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; }
}

.page { display: flex; flex-direction: column; height: 100%; background: var(--bg-page); }

/* ---------- 顶部栏 ---------- */
.header { position: relative; height: var(--header-h); flex: none; background: var(--bg-card); }
.header-inner { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 4px; }
.header-title { font-size: 17px; font-weight: 600; line-height: 24px; letter-spacing: 0.2px; }
.header-meta { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-sub); line-height: 16px; }
.header-meta svg { display: block; }
.icon-btn {
  position: absolute; top: 0; display: flex; align-items: center; justify-content: center;
  width: 44px; height: var(--header-h); border: 0; background: none; cursor: pointer; color: var(--icon);
}
.icon-btn.back { left: 4px; }
.icon-btn.settings { right: 6px; }
.icon-btn:active { opacity: 0.55; }

/* ---------- 视频区 ---------- */
.stage { flex: none; }
.video-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #0B0B0C; overflow: hidden; }
.video-feed {
  position: absolute; inset: 0; transition: transform 0.25s ease;
  background:
    radial-gradient(120% 80% at 18% 12%, rgba(120, 132, 150, 0.55) 0%, rgba(28, 30, 36, 0) 58%),
    radial-gradient(90% 70% at 82% 18%, rgba(92, 96, 110, 0.45) 0%, rgba(20, 20, 24, 0) 62%),
    linear-gradient(160deg, #3A3D45 0%, #23252B 42%, #141518 100%);
}
/* 画面内容占位：接入真实流后删除以下两段 */
.video-feed::before {
  content: ""; position: absolute; left: 16%; top: 52%; width: 46%; height: 34%;
  background: linear-gradient(120deg, rgba(255,255,255,0.06), rgba(255,255,255,0));
  border-radius: 6px; transform: rotate(-2deg);
}
.video-feed::after {
  content: ""; position: absolute; right: -6%; bottom: -12%; width: 62%; height: 56%;
  background: radial-gradient(closest-side, rgba(0,0,0,0.55), rgba(0,0,0,0));
}
.video-timestamp {
  position: absolute; left: 12px; top: 10px; font-size: 11px; letter-spacing: 0.2px;
  color: rgba(255, 255, 255, 0.92); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
  font-variant-numeric: tabular-nums;
}
.video-rec {
  position: absolute; right: 12px; top: 8px; display: none; align-items: center; gap: 5px;
  padding: 3px 8px; border-radius: 20px; background: rgba(0, 0, 0, 0.45);
  font-size: 11px; color: #fff; font-variant-numeric: tabular-nums;
}
.video-rec.on { display: flex; }
.rec-dot { width: 7px; height: 7px; border-radius: 50%; background: #FF3B30; animation: blink 1.1s infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

/* 回放态角标 */
.video-mode-tag {
  position: absolute; left: 12px; bottom: 10px; display: none; align-items: center; gap: 5px;
  padding: 3px 8px; border-radius: 4px; background: rgba(0, 0, 0, 0.45);
  font-size: 11px; color: #fff;
}
.video-wrap.playing .video-mode-tag { display: flex; }
.video-wrap.playing .video-feed { filter: brightness(0.82); }

.video-off {
  position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  background: #121214; color: rgba(255, 255, 255, 0.55); font-size: 13px;
}
.video-off.on { display: flex; }
.video-off svg { opacity: 0.6; }

/* ---------- 直播 / 回放 共用控制条 ---------- */
.control-bar {
  flex: none; height: 42px; background: var(--bg-bar);
  display: flex; align-items: center; justify-content: space-between; padding: 0 22px;
}
.cb-btn { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border: 0; background: none; color: #fff; cursor: pointer; }
.cb-btn:active { opacity: 0.6; }
.cb-btn .off-line { display: none; }
.cb-btn.is-off .on-icon { display: none; }
.cb-btn.is-off .off-line { display: inline; }
.quality-pill {
  min-width: 58px; height: 26px; padding: 0 10px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(255, 255, 255, 0.32); border-radius: 6px;
  background: rgba(255, 255, 255, 0.1); color: #fff; font-size: 12px; line-height: 1; cursor: pointer;
}
.quality-pill:active { background: rgba(255, 255, 255, 0.22); }

/* 回放控制条 */
.playbar { flex: none; height: 44px; background: var(--bg-bar); display: none; align-items: center; gap: 10px; padding: 0 14px; }
.playbar.on { display: flex; }
.pb-play { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border: 0; background: none; color: #fff; cursor: pointer; flex: none; }
.pb-time { font-size: 11px; color: rgba(255, 255, 255, 0.85); font-variant-numeric: tabular-nums; flex: none; }
.pb-track { position: relative; flex: 1; height: 14px; display: flex; align-items: center; cursor: pointer; }
.pb-track::before { content: ""; position: absolute; left: 0; right: 0; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.28); }
.pb-fill { position: absolute; left: 0; height: 3px; border-radius: 2px; background: #fff; width: 0; }
.pb-thumb { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #fff; transform: translateX(-50%); left: 0; }

/* ---------- 白色功能卡 ---------- */
.fn-card {
  flex: none; background: var(--bg-card);
  border-radius: 0 0 var(--radius-card) var(--radius-card);
  padding: 14px 6px 6px; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05); z-index: 2;
}
.fn-row { display: flex; align-items: flex-start; }
.fn-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px;
  border: 0; background: none; padding: 4px 0; cursor: pointer; color: var(--icon);
}
.fn-item:active { opacity: 0.55; }
.fn-label { font-size: 13px; line-height: 18px; color: var(--text-main); }
.fn-item.active { color: var(--orange); }
.fn-item.active .fn-label { color: var(--orange); font-weight: 600; }
.fn-item.recording { color: #FF3B30; }
.fn-item.recording .fn-label { color: #FF3B30; }

/* 返回直播：橙底白标，视觉上明显区别于其他项 */
.fn-item.back-live .icon-wrap {
  width: 30px; height: 30px; border-radius: 50%; background: var(--orange);
  display: flex; align-items: center; justify-content: center; color: #fff;
  box-shadow: 0 2px 8px rgba(255, 138, 30, 0.4);
}
.fn-item.back-live { color: var(--orange); }
.fn-item.back-live .fn-label { color: var(--orange); font-weight: 600; }

.sheet-handle { width: 36px; height: 4px; border-radius: 4px; background: #D5D5DA; margin: 10px auto 2px; }

/* ---------- 事件列表 ---------- */
.list-zone { position: relative; flex: 1; min-height: 0; display: flex; }
.list-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg-page); }

.day-head {
  position: sticky; top: 0; z-index: 3;
  display: flex; align-items: baseline; gap: 8px;
  padding: 12px 16px 10px; background: var(--bg-page);
  font-size: 15px; font-weight: 600; color: #2C2C30;
}
.day-head .count { font-size: 12px; font-weight: 400; color: var(--text-sub); }
/* 查看更多回放：与日期标题同一行，右对齐 */
.more-link {
  margin-left: auto; display: inline-flex; align-items: center; gap: 2px;
  border: 0; background: none; padding: 2px 0 2px 8px; cursor: pointer;
  font-size: 12px; color: #5B5B62;
}
.more-link:active { opacity: 0.6; }

.event-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 16px 4px; }
.event { display: flex; flex-direction: column; gap: 6px; }
.event-thumb {
  position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden;
  background: linear-gradient(160deg, #4A4E57 0%, #2A2C32 48%, #17181C 100%);
  border: 2px solid transparent; cursor: pointer;
}
.event-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.event.selected .event-thumb { border-color: var(--blue); }
.event-time {
  position: absolute; left: 7px; bottom: 6px; font-size: 12px; color: #fff;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55); font-variant-numeric: tabular-nums;
}
.event-play {
  position: absolute; right: 6px; bottom: 6px; width: 20px; height: 20px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.9); color: #111;
  display: flex; align-items: center; justify-content: center;
}
.event-meta { display: flex; align-items: center; gap: 6px; height: 20px; }
/* 事件类型以文本呈现 */
.event-type { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #7A7A80; }
.type-dot { width: 7px; height: 7px; border-radius: 50%; background: #C9C9CF; }
/* 选中态：文字加深加粗即可，不用颜色区分类型 */
.event.selected .event-type { color: #1D1D1F; font-weight: 600; }
.event.selected .type-dot { background: #1D1D1F; }

.empty { padding: 40px 16px; text-align: center; color: var(--text-sub); font-size: 13px; }

/* ---------- 云台浮窗：从顶部向下展开 ---------- */
/* 浮窗从列表区顶部向下推出 */
.ptz-layer { position: absolute; inset: 0; display: none; background: rgba(0, 0, 0, 0.2); z-index: 20; overflow: hidden; }
.ptz-layer.on { display: block; }
.ptz-float {
  position: absolute; left: 0; right: 0; top: 0;
  background: #fff; border-radius: 0 0 20px 20px; padding: 14px 14px 22px;
  box-shadow: 0 14px 30px rgba(0, 0, 0, 0.16);
  transform: translateY(-100%);
  transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.3, 1);
}
.ptz-layer.on .ptz-float { transform: translateY(0); }
/* 云台展开时功能卡底角拉平，与面板连成一整块 */
.phone.ptz-open .fn-card,
.phone.ptz-open #liveFnCard,
.phone.ptz-open #playFnCard { border-radius: 0 0 0 0; box-shadow: none; }
.phone.ptz-open .sheet-handle { opacity: 1; }
.ptz-head { display: flex; align-items: center; padding: 2px 2px 8px; }
.ptz-title { font-size: 15px; font-weight: 600; }
.ptz-close { border: 0; background: none; font-size: 13px; color: var(--text-sub); cursor: pointer; }

.ptz-pad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 64px); gap: 8px; justify-content: center; align-items: center; }
.ptz-pad button { display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; border: 0; border-radius: 16px; background: #F2F3F5; color: var(--icon); cursor: pointer; }
.ptz-pad button:active { background: #E6E7EA; }
.ptz-pad .center { background: #1D1D1F; color: #fff; border-radius: 50%; }
.ptz-empty { width: 64px; height: 64px; }

/* ---------- 轻提示 / 闪光 ---------- */
.toast {
  position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(6px);
  padding: 9px 16px; border-radius: 20px; background: rgba(29, 29, 31, 0.88); color: #fff;
  font-size: 13px; white-space: nowrap; opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease; z-index: 30;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 15; }
.flash.on { animation: flashOut 0.36s ease; }
@keyframes flashOut { 0% { opacity: 0.85; } 100% { opacity: 0; } }

/* ---------- 回放页（占位，可替换为真实回放页） ---------- */
.subpage {
  position: absolute; inset: 0; z-index: 40; background: var(--bg-page);
  display: none; flex-direction: column; transform: translateX(100%);
  transition: transform 0.24s ease;
}
.subpage.on { display: flex; transform: translateX(0); }
.sub-header { position: relative; flex: none; height: 56px; background: #fff; display: flex; align-items: center; justify-content: center; }
.sub-title { font-size: 16px; font-weight: 600; }
.sub-body { flex: 1; overflow-y: auto; padding-bottom: 24px; }
.date-row { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; scrollbar-width: none; background: #fff; }
.date-row::-webkit-scrollbar { display: none; }
.date-chip { flex: none; padding: 7px 14px; border-radius: 16px; background: #F2F3F5; font-size: 13px; color: #4A4A50; cursor: pointer; border: 1px solid transparent; }
.date-chip.active { background: #FFF3E8; border-color: var(--orange); color: var(--orange); }

/* ---------- 全屏态 ---------- */
.phone.fullscreen .header { display: none; }
.phone.fullscreen .video-wrap { aspect-ratio: auto; flex: 1; }
.phone.fullscreen .stage { flex: 1; display: flex; flex-direction: column; }
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="page">

    <!-- 顶部栏 -->
    <header class="header">
      <button class="icon-btn back" aria-label="返回">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19" /></svg>
      </button>
      <div class="header-inner">
        <div class="header-title" id="deviceName">客厅</div>
        <div class="header-meta">
          <svg width="14" height="12" viewBox="0 0 14 12" fill="currentColor" aria-hidden="true">
            <rect x="0" y="8" width="2.4" height="4" rx="1" opacity="0.35"/>
            <rect x="3.8" y="6" width="2.4" height="6" rx="1" opacity="0.55"/>
            <rect x="7.6" y="3" width="2.4" height="9" rx="1" opacity="0.8"/>
            <rect x="11.4" y="0" width="2.4" height="12" rx="1"/>
          </svg>
          <span id="speedText">7KB/S</span>
        </div>
      </div>
      <button class="icon-btn settings" aria-label="设置">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
          <path d="M12 2.6 L19.2 6.8 V17.2 L12 21.4 L4.8 17.2 V6.8 Z" /><circle cx="12" cy="12" r="3.1" />
        </svg>
      </button>
    </header>

    <!-- 视频 + 控制 + 功能卡（固定区） -->
    <div class="stage">
      <div class="video-wrap" id="videoWrap">
        <div class="video-feed" id="videoFeed"></div>
        <div class="video-timestamp" id="timestamp">2026/10/27 星期二 15:37:52</div>
        <div class="video-mode-tag">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <span>回放</span>
        </div>
        <div class="video-rec" id="recBadge"><span class="rec-dot"></span><span id="recTime">00:00</span></div>
        <div class="video-off" id="videoOff">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3.5 v8" /><path d="M7.2 6.6 a7 7 0 1 0 9.6 0" /></svg>
          <span>设备已关闭</span>
        </div>
        <div class="flash" id="flash"></div>
      </div>

      <!-- 直播控制条 -->
      <div class="control-bar" id="liveBar">
        <button class="cb-btn" id="powerBtn" aria-label="开关设备">
          <svg class="on-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3.5 v8" /><path d="M7.2 6.6 a7 7 0 1 0 9.6 0" /></svg>
          <svg class="off-line" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3.5 v8" /><path d="M7.2 6.6 a7 7 0 1 0 9.6 0" /><path d="M4 20 L20 4" /></svg>
        </button>
        <button class="cb-btn is-off" id="muteBtn" aria-label="静音">
          <svg class="on-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9.5 h3.2 L12 5.6 v12.8 L7.2 14.5 H4 Z" /><path d="M15.6 9.2 a4.2 4.2 0 0 1 0 5.6" /><path d="M18.2 6.8 a7.4 7.4 0 0 1 0 10.4" />
          </svg>
          <svg class="off-line" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9.5 h3.2 L12 5.6 v12.8 L7.2 14.5 H4 Z" /><path d="M16.2 9.4 L21 14.2" />
          </svg>
        </button>
        <button class="quality-pill" id="qualityBtn">超清</button>
        <button class="cb-btn" id="fullBtn" aria-label="全屏">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 H4 v5" /><path d="M15 4 h5 v5" /><path d="M15 20 h5 v-5" /><path d="M9 20 H4 v-5" /></svg>
        </button>
      </div>

      <!-- 回放控制条 -->
      <div class="playbar" id="playBar">
        <button class="pb-play" id="pbToggle" aria-label="播放/暂停">
          <svg id="pbPlayIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <span class="pb-time" id="pbTime">00:00 / 00:30</span>
        <div class="pb-track" id="pbTrack">
          <div class="pb-fill" id="pbFill"></div>
          <div class="pb-thumb" id="pbThumb"></div>
        </div>
        <button class="cb-btn" id="pbFull" aria-label="全屏">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 H4 v5" /><path d="M15 4 h5 v5" /><path d="M15 20 h5 v-5" /><path d="M9 20 H4 v-5" /></svg>
        </button>
      </div>

      <!-- 直播功能卡 -->
      <div class="fn-card" id="liveFnCard">
        <div class="fn-row">
          <button class="fn-item" id="talkBtn">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <rect x="9.2" y="2.8" width="5.6" height="10.4" rx="2.8" /><path d="M5.6 11.6 a6.4 6.4 0 0 0 12.8 0" /><path d="M12 18 v3.2" />
            </svg>
            <span class="fn-label">语音</span>
          </button>
          <button class="fn-item" id="shotBtn">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.2 8.4 h3.4 l1.6 -2.4 h7.6 l1.6 2.4 h3.4 v10.2 H3.2 Z" /><circle cx="12" cy="13.2" r="3.4" />
            </svg>
            <span class="fn-label">截图</span>
          </button>
          <button class="fn-item" id="recBtn">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.8" y="6.2" width="12.6" height="11.6" rx="2.4" /><path d="M15.4 11 L21.2 7.8 v8.4 L15.4 13 Z" />
            </svg>
            <span class="fn-label" id="recLabel">录制</span>
          </button>
          <button class="fn-item" id="ptzBtn">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="8.4" /><circle cx="12" cy="12" r="2.1" fill="currentColor" stroke="none" />
              <path d="M12 2.4 v3" /><path d="M12 18.6 v3" /><path d="M2.4 12 h3" /><path d="M18.6 12 h3" />
            </svg>
            <span class="fn-label">云台</span>
          </button>
        </div>
        <div class="sheet-handle"></div>
      </div>

      <!-- 回放功能卡：左侧醒目的「返回直播」 -->
      <div class="fn-card" id="playFnCard" style="display:none">
        <div class="fn-row">
          <button class="fn-item back-live" id="backLiveBtn">
            <span class="icon-wrap">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 12 a8 8 0 1 1 -2.6 -5.9" /><path d="M20 4 v4.4 h-4.4" />
              </svg>
            </span>
            <span class="fn-label">返回直播</span>
          </button>
          <button class="fn-item" id="speedBtn">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 7.5 L11 12 L5 16.5" /><path d="M12.6 7.5 L18.6 12 L12.6 16.5" />
            </svg>
            <span class="fn-label" id="speedLabel">倍速</span>
          </button>
          <button class="fn-item" id="downloadBtn">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3.6 v11" /><path d="M7.6 10.4 L12 14.8 L16.4 10.4" /><path d="M4.6 17.6 v2.6 h14.8 v-2.6" />
            </svg>
            <span class="fn-label">下载</span>
          </button>
          <button class="fn-item" id="deleteBtn">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.5 7 h15" /><path d="M9.5 7 V4.6 h5 V7" /><path d="M6.6 7 l0.9 12.4 h9 l0.9 -12.4" /><path d="M10.4 10.6 v6" /><path d="M13.6 10.6 v6" />
            </svg>
            <span class="fn-label">删除</span>
          </button>
        </div>
        <div class="sheet-handle"></div>
      </div>
    </div>

    <!-- 事件列表（仅今日） -->
    <div class="list-zone">
      <div class="list-area" id="listArea">
      <div class="day-head">
        <span id="dayTitle">今天</span><span class="count" id="dayCount"></span>
        <button class="more-link" id="moreBtn">
          <span>查看更多回放</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5 L16 12 L9 19" /></svg>
        </button>
      </div>
      <div class="event-grid" id="eventGrid"></div>
      </div>

    <!-- 云台浮窗（从顶部向下展开） -->
    <div class="ptz-layer" id="ptzMask">
      <div class="ptz-float">
          <div class="ptz-pad">
          <div class="ptz-empty"></div>
          <button data-dir="up" aria-label="上"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14 L12 8 L18 14"/></svg></button>
          <div class="ptz-empty"></div>
          <button data-dir="left" aria-label="左"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6 L8 12 L14 18"/></svg></button>
          <button class="center" data-dir="center" aria-label="复位"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="3.4"/></svg></button>
          <button data-dir="right" aria-label="右"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6 L16 12 L10 18"/></svg></button>
          <div class="ptz-empty"></div>
          <button data-dir="down" aria-label="下"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10 L12 16 L18 10"/></svg></button>
          <div class="ptz-empty"></div>
        </div>
      </div>
    </div>
    </div>
  </div>

  <!-- 回放页（占位页面） -->
  <div class="subpage" id="subpage">
    <div class="sub-header">
      <button class="icon-btn back" id="subBack" aria-label="返回">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19" /></svg>
      </button>
      <span class="sub-title">回放 · 客厅</span>
    </div>
    <div class="date-row" id="dateRow"></div>
    <div class="sub-body">
      <div class="event-grid" id="pastGrid" style="padding-top:12px"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ================= 基础状态 ================= */
const $ = (id) => document.getElementById(id);
const phone = $('phone');
const state = {
  deviceName: '客厅', speedKbps: 7, online: true, muted: true, quality: '超清',
  recording: false, fullscreen: false, mode: 'live', selectedId: null,
  playing: false, progress: 0, duration: 30, rate: 1
};

let toastTimer = null;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

/* ================= 事件类型（直接以文本展示） ================= */
const EVENT_TYPES = {
  motion: { label: '运动侦测' },
  human:  { label: '人形侦测' },
  sound:  { label: '声音侦测' }
};

function todayStr() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
const TODAY = todayStr();

// 今日事件：时间倒序
const todayEvents = [
  { id: 'e1', time: '14:32', type: 'human',  dur: 22 },
  { id: 'e2', time: '12:07', type: 'motion', dur: 15 },
  { id: 'e3', time: '10:48', type: 'human',  dur: 18 },
  { id: 'e4', time: '09:45', type: 'motion', dur: 30 },
  { id: 'e5', time: '08:15', type: 'sound',  dur: 12 },
  { id: 'e6', time: '07:52', type: 'motion', dur: 26 }
];

// 历史事件（回放页占位数据）
const pastEvents = {
  '10-26': [
    { id: 'p1', time: '21:12', type: 'human', dur: 20 },
    { id: 'p2', time: '18:30', type: 'motion', dur: 16 },
    { id: 'p3', time: '09:05', type: 'human', dur: 24 }
  ],
  '10-25': [
    { id: 'p4', time: '19:17', type: 'human', dur: 18 },
    { id: 'p5', time: '19:13', type: 'motion', dur: 12 },
    { id: 'p6', time: '19:10', type: 'motion', dur: 14 }
  ],
  '10-24': [
    { id: 'p7', time: '16:44', type: 'human', dur: 28 },
    { id: 'p8', time: '11:02', type: 'motion', dur: 19 }
  ]
};

/* ================= 渲染：事件网格 ================= */
function eventMarkup(ev, selectedId) {
  const selected = ev.id === selectedId ? ' selected' : '';
  const type = EVENT_TYPES[ev.type] || { label: '事件' };

  return `<div class="event${selected}" data-id="${ev.id}">
    <div class="event-thumb">
      <span class="event-time">${ev.time}</span>
      <span class="event-play"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
    </div>
    <div class="event-meta">
      <span class="event-type"><i class="type-dot"></i>${type.label}</span>
    </div>
  </div>`;
}

function renderEvents() {
  const list = todayEvents;

  $('dayTitle').textContent = '今天';
  $('dayCount').textContent = TODAY.slice(5).replace('-', '月') + '日 · ' + list.length + ' 条';

  const grid = $('eventGrid');
  grid.innerHTML = list.length
    ? list.map((ev) => eventMarkup(ev, state.selectedId)).join('')
    : '<div class="empty">今天还没有事件</div>';

  grid.querySelectorAll('.event').forEach((node) => {
    node.addEventListener('click', () => onEventClick(node.dataset.id));
  });
}

/* ================= 直播 / 回放 切换 ================= */
function enterPlayback(ev) {
  togglePtz(false);
  state.mode = 'playback';
  state.selectedId = ev.id;
  state.duration = ev.dur;
  state.progress = 0;
  state.playing = true;

  $('liveBar').style.display = 'none';
  $('playBar').classList.add('on');
  $('liveFnCard').style.display = 'none';
  $('playFnCard').style.display = 'block';
  $('videoWrap').classList.add('playing');
  $('timestamp').textContent = `${TODAY.replace(/-/g, '/')} ${ev.time}:00`;

  renderEvents();
  startProgress();
  toast(`正在播放 ${ev.time} 的事件片段`);
}

function backToLive() {
  togglePtz(false);
  state.mode = 'live';
  state.selectedId = null;
  state.playing = false;
  stopProgress();

  $('liveBar').style.display = 'flex';
  $('playBar').classList.remove('on');
  $('liveFnCard').style.display = 'block';
  $('playFnCard').style.display = 'none';
  $('videoWrap').classList.remove('playing');

  renderTimestamp();
  renderEvents();
  toast('已返回直播');
}

function onEventClick(id) {
  const ev = todayEvents.find((e) => e.id === id) || Object.values(pastEvents).flat().find((e) => e.id === id);
  if (!ev) return;
  enterPlayback(ev);
}

/* ================= 回放进度 ================= */
let progressTimer = null;
function startProgress() {
  stopProgress();
  progressTimer = setInterval(() => {
    if (!state.playing) return;
    state.progress = Math.min(state.duration, state.progress + 0.25 * (state.rate || 1));
    if (state.progress >= state.duration) state.playing = false;
    renderProgress();
  }, 250);
  renderProgress();
}
function stopProgress() { clearInterval(progressTimer); progressTimer = null; }

function fmt(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(Math.floor(sec % 60)).padStart(2, '0');
  return `${m}:${s}`;
}
function renderProgress() {
  const pct = state.duration ? (state.progress / state.duration) * 100 : 0;
  $('pbFill').style.width = pct + '%';
  $('pbThumb').style.left = pct + '%';
  $('pbTime').textContent = `${fmt(state.progress)} / ${fmt(state.duration)}`;
  $('pbPlayIcon').innerHTML = state.playing
    ? '<rect x="6.5" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

$('pbToggle').addEventListener('click', () => {
  state.playing = !state.playing;
  if (state.progress >= state.duration) state.progress = 0;
  renderProgress();
});
$('pbTrack').addEventListener('click', (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  state.progress = pct * state.duration;
  renderProgress();
});

/* ================= 回放功能卡 ================= */
$('backLiveBtn').addEventListener('click', backToLive);

// 倍速：0.5x / 1x / 1.5x / 2x 循环
const RATES = [0.5, 1, 1.5, 2];
let rateIndex = 1;
$('speedBtn').addEventListener('click', () => {
  rateIndex = (rateIndex + 1) % RATES.length;
  state.rate = RATES[rateIndex];
  $('speedLabel').textContent = state.rate === 1 ? '倍速' : state.rate + 'x';
  toast('当前 ' + state.rate + 'x 播放');
});

$('downloadBtn').addEventListener('click', () => toast('已加入下载任务'));

$('deleteBtn').addEventListener('click', () => {
  const idx = todayEvents.findIndex((e) => e.id === state.selectedId);
  if (idx > -1) todayEvents.splice(idx, 1);
  backToLive();
  toast('事件已删除');
});

/* ================= 更多回放页 ================= */
let subDate = null;
function renderDates() {
  const keys = ['10-27', ...Object.keys(pastEvents)];
  $('dateRow').innerHTML = keys.map((k) => {
    const label = k === '10-27' ? '今天' : `${k.split('-')[1]}日`;
    const active = (subDate || '10-27') === k ? ' active' : '';
    return `<button class="date-chip${active}" data-date="${k}">${label}</button>`;
  }).join('');

  $('dateRow').querySelectorAll('[data-date]').forEach((btn) => {
    btn.addEventListener('click', () => {
      subDate = btn.dataset.date;
      renderDates();
      renderPast();
    });
  });
}
function renderPast() {
  const key = subDate || '10-27';
  const list = key === '10-27' ? todayEvents : (pastEvents[key] || []);
  const grid = $('pastGrid');
  grid.innerHTML = list.length
    ? list.map((ev) => eventMarkup(ev, state.selectedId)).join('')
    : '<div class="empty">该日没有事件</div>';

  grid.querySelectorAll('.event').forEach((node) => {
    node.addEventListener('click', () => {
      closeSubpage();
      onEventClick(node.dataset.id);
    });
  });
}
function openSubpage() {
  subDate = null;
  renderDates();
  renderPast();
  $('subpage').classList.add('on');
}
function closeSubpage() { $('subpage').classList.remove('on'); }

$('moreBtn').addEventListener('click', openSubpage);
$('subBack').addEventListener('click', closeSubpage);

/* ================= 直播功能卡 ================= */
$('talkBtn').addEventListener('pointerdown', () => {
  if (!state.online) return toast('设备已关闭');
  $('talkBtn').classList.add('active');
  toast('正在说话…');
});
['pointerup', 'pointercancel', 'pointerleave'].forEach((evt) => {
  $('talkBtn').addEventListener(evt, () => {
    $('talkBtn').classList.remove('active');
  });
});

$('shotBtn').addEventListener('click', () => {
  const flash = $('flash');
  flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
  toast('截图已保存至相册');
});

let recTimer = null, recSeconds = 0, recState = false;
$('recBtn').addEventListener('click', () => {
  recState = !recState;
  $('recBtn').classList.toggle('recording', recState);
  $('recBadge').classList.toggle('on', recState);
  $('recLabel').textContent = recState ? '停止' : '录制';
  if (recState) {
    recSeconds = 0; $('recTime').textContent = '00:00';
    recTimer = setInterval(() => { recSeconds += 1; $('recTime').textContent = fmt(recSeconds); }, 1000);
    toast('开始录制');
  } else {
    clearInterval(recTimer);
    toast(`录制完成，时长 ${fmt(recSeconds)}`);
  }
});

let ptzTimer = null;
function togglePtz(open) {
  const next = typeof open === 'boolean' ? open : !$('ptzMask').classList.contains('on');
  clearTimeout(ptzTimer);
  if (next) {
    phone.classList.add('ptz-open');          // 先拉平功能卡底角，面板再从下方推出
    $('ptzMask').classList.add('on');
    $('ptzBtn').classList.add('active');
  } else {
    $('ptzMask').classList.remove('on');
    $('ptzBtn').classList.remove('active');
    // 等收起动画结束再把圆角还原，避免中途露出缝隙
    ptzTimer = setTimeout(() => phone.classList.remove('ptz-open'), 320);
  }
}
$('ptzBtn').addEventListener('click', () => {
  if (!state.online) return toast('设备已关闭');
  togglePtz();
});
$('ptzMask').addEventListener('click', (e) => { if (e.target === $('ptzMask')) togglePtz(false); });
$('ptzMask').querySelectorAll('[data-dir]').forEach((btn) => {
  btn.addEventListener('click', () => {
    const dir = btn.dataset.dir;
    const map = { up: '上', down: '下', left: '左', right: '右', center: '复位' };
    const shift = { up: 'translateY(-6px)', down: 'translateY(6px)', left: 'translateX(-6px)', right: 'translateX(6px)', center: 'translate(0,0)' }[dir];
    $('videoFeed').style.transform = shift;
    toast(dir === 'center' ? '镜头已复位' : `镜头${map[dir]}`);
  });
});

/* ================= 直播控制条 ================= */
function renderTimestamp() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  const week = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'][d.getDay()];
  $('timestamp').textContent = `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${week} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
renderTimestamp();
setInterval(() => { if (state.mode === 'live') renderTimestamp(); }, 1000);

function renderSpeed() {
  $('speedText').textContent = state.online ? `${state.speedKbps}KB/S` : '离线';
}
renderSpeed();

$('powerBtn').addEventListener('click', () => {
  state.online = !state.online;
  $('powerBtn').classList.toggle('is-off', !state.online);
  $('videoOff').classList.toggle('on', !state.online);
  renderSpeed();
  toast(state.online ? '设备已开启' : '设备已关闭');
});

$('muteBtn').addEventListener('click', () => {
  state.muted = !state.muted;
  $('muteBtn').classList.toggle('is-off', state.muted);
  toast(state.muted ? '已静音' : '已取消静音');
});

const qualityList = ['标清', '高清', '超清'];
$('qualityBtn').addEventListener('click', () => {
  const i = qualityList.indexOf(state.quality);
  state.quality = qualityList[(i + 1) % qualityList.length];
  $('qualityBtn').textContent = state.quality;
  toast(`已切换至${state.quality}`);
});

$('fullBtn').addEventListener('click', () => {
  state.fullscreen = !state.fullscreen;
  phone.classList.toggle('fullscreen', state.fullscreen);
});
$('pbFull').addEventListener('click', () => {
  state.fullscreen = !state.fullscreen;
  phone.classList.toggle('fullscreen', state.fullscreen);
});

/* ================= 初始化 ================= */
renderEvents();
renderProgress();
</script>
</body>
</html>
